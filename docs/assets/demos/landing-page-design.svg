<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="lp-hero-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="lp-btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="lp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#lp-bg)" stroke="#1F2937" stroke-width="1.5"/>
  <circle cx="400" cy="180" r="160" fill="#1E3A8A" opacity="0.12" filter="url(#lp-glow)"/>

  <!-- Fluid Island Nav -->
  <rect x="260" y="24" width="280" height="38" rx="19" fill="#111827" stroke="#374151" stroke-width="1" fill-opacity="0.85"/>
  <circle cx="282" cy="43" r="6" fill="#3B82F6"/>
  <text x="296" y="47" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LandingPageCraft</text>
  <text x="420" y="47" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Features</text>
  <text x="470" y="47" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">FAQ</text>
  <rect x="500" y="31" width="32" height="24" rx="12" fill="#2563EB"/>
  <text x="516" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Get</text>

  <!-- Hero Pill Tag -->
  <rect x="300" y="86" width="200" height="24" rx="12" fill="#1F2937" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="312" cy="98" r="3.5" fill="#10B981"/>
  <text x="322" y="101" fill="#93C5FD" font-family="monospace" font-size="10" font-weight="600">ONE OFFER → ONE ACTION</text>

  <!-- Hero Headline -->
  <text x="400" y="146" fill="url(#lp-hero-text)" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="-0.5">High-Converting Landing Pages</text>
  <text x="400" y="176" fill="url(#lp-hero-text)" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Engineered in Pure Code</text>

  <!-- Subheadline -->
  <text x="400" y="208" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Geist typography • Strict spacing tokens • Nested radii formula • Fluid motion</text>

  <!-- CTA Buttons -->
  <rect x="330" y="228" width="140" height="36" rx="8" fill="url(#lp-btn-grad)" filter="url(#lp-glow)"/>
  <text x="400" y="250" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Start Free Trial →</text>

  <!-- Feature Cards Grid (Nested Radius Demo) -->
  <g transform="translate(80, 290)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="195" height="125" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <rect x="12" y="12" width="32" height="32" rx="8" fill="#1E3A8A" fill-opacity="0.6"/>
    <text x="28" y="33" fill="#60A5FA" font-size="14" text-anchor="middle">✦</text>
    <text x="12" y="64" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Part A: Strategy</text>
    <text x="12" y="82" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Outcome without pain copy,</text>
    <text x="12" y="96" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">objections &amp; proof placement.</text>
    <rect x="12" y="106" width="70" height="8" rx="4" fill="#374151"/>

    <!-- Card 2 -->
    <rect x="222" y="0" width="195" height="125" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <rect x="234" y="12" width="32" height="32" rx="8" fill="#065F46" fill-opacity="0.6"/>
    <text x="250" y="33" fill="#34D399" font-size="14" text-anchor="middle">❖</text>
    <text x="234" y="64" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Part B: Visual System</text>
    <text x="234" y="82" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Zero background gradients,</text>
    <text x="234" y="96" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">nested radii: r_in = r_out - gap.</text>
    <rect x="234" y="106" width="85" height="8" rx="4" fill="#374151"/>

    <!-- Card 3 -->
    <rect x="445" y="0" width="195" height="125" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <rect x="457" y="12" width="32" height="32" rx="8" fill="#581C87" fill-opacity="0.6"/>
    <text x="473" y="33" fill="#C084FC" font-size="14" text-anchor="middle">⚡</text>
    <text x="457" y="64" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Fluid Motion Physics</text>
    <text x="457" y="82" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">cubic-bezier(0.32,0.72,0,1)</text>
    <text x="457" y="96" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Word-by-word scroll reveal.</text>
    <rect x="457" y="106" width="95" height="8" rx="4" fill="#374151"/>
  </g>
</svg>