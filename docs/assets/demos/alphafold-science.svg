<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Header Badge -->
  <rect x="40" y="30" width="180" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.25" stroke="#A78BFA" stroke-width="1"/>
  <text x="130" y="47" fill="#C4B5FD" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GOOGLE DEEPMIND SCIENCE</text>
  
  <text x="40" y="90" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">AlphaFold DB &amp; 3D Bio Structure Suite</text>
  <text x="40" y="114" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">3D Protein Visualizer • pLDDT Structural Confidence • ClinVar • ChEMBL • BLAST</text>

  <!-- Science Visualization Card -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="720" height="180" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Top bar -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H708C714.627 0 720 5.37258 720 12V32H0V12Z" fill="#1E293B"/>
    <text x="20" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Mol* Interactive 3D Biomolecular Sidecar</text>
    <rect x="570" y="6" width="135" height="20" rx="6" fill="#8B5CF6" fill-opacity="0.25"/>
    <text x="637" y="20" fill="#C4B5FD" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">UniProt: P04637 (TP53)</text>

    <!-- Visual Presentation -->
    <g transform="translate(20, 48)">
      <!-- Left: Mock 3D Mol Canvas -->
      <rect x="0" y="0" width="410" height="115" rx="8" fill="#050811" stroke="#1E293B"/>
      
      <!-- Abstract 3D Ribbon Art -->
      <path d="M40 70 Q90 15 150 65 T250 55 T340 75" stroke="#38BDF8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M50 80 Q100 25 160 75 T260 65 T350 85" stroke="#818CF8" stroke-width="3" fill="none" opacity="0.6"/>
      <circle cx="150" cy="65" r="8" fill="#F43F5E"/>
      <circle cx="210" cy="45" r="6" fill="#FACC15"/>
      <circle cx="280" cy="65" r="7" fill="#10B981"/>
      <text x="16" y="105" fill="#64748B" font-family="monospace" font-size="10">Active Site: Zinc Binding Cys176-His179</text>

      <!-- Right: Confidence Metrics -->
      <rect x="425" y="0" width="255" height="115" rx="8" fill="#020617" stroke="#1E293B"/>
      <text x="440" y="24" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">pLDDT Score: 94.8% (Very High)</text>
      <text x="440" y="46" fill="#94A3B8" font-family="monospace" font-size="10">Residues: 393 aa</text>
      <text x="440" y="66" fill="#94A3B8" font-family="monospace" font-size="10">AlphaFold Model: AF-P04637-F1</text>
      <text x="440" y="86" fill="#38BDF8" font-family="monospace" font-size="10">Viewer: Mol* Interactive Sidecar</text>
      <text x="440" y="104" fill="#A78BFA" font-family="monospace" font-size="10">Export: mmCIF / PDB coordinates</text>
    </g>
  </g>

  <!-- Terminal Command Footer -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="720" height="75" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="20" y="30" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">$ ./vas install alphafold-database-fetch-and-analyze --mode link</text>
    <text x="20" y="55" fill="#64748B" font-family="monospace" font-size="11">✓ 39+ Science playbooks: AlphaFold, ChEMBL, ClinVar, PyMOL, PubMed, Ensembl.</text>
  </g>
