<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Header Badge -->
  <rect x="40" y="30" width="170" height="26" rx="13" fill="#EA580C" fill-opacity="0.25" stroke="#FB923C" stroke-width="1"/>
  <text x="125" y="47" fill="#FB923C" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FIREBASE ECOSYSTEM</text>
  
  <text x="40" y="90" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Firestore &amp; Security Rules Auditor</text>
  <text x="40" y="114" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">NoSQL Schema Design • Security Rules Auditor • App Hosting SSR • Crashlytics</text>

  <!-- Security Audit Visualization Card -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="720" height="180" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Top bar -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H708C714.627 0 720 5.37258 720 12V32H0V12Z" fill="#1E293B"/>
    <text x="20" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Firestore Rules Red-Team Auditor</text>
    <rect x="585" y="6" width="120" height="20" rx="6" fill="#10B981" fill-opacity="0.25"/>
    <text x="645" y="20" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">PASSED: 100/100</text>

    <!-- Visual Presentation -->
    <g transform="translate(20, 48)">
      <!-- Left: Rules Definition -->
      <rect x="0" y="0" width="440" height="115" rx="8" fill="#050811" stroke="#1E293B"/>
      <text x="16" y="22" fill="#FB923C" font-family="monospace" font-size="11">rules_version = '2';</text>
      <text x="16" y="42" fill="#38BDF8" font-family="monospace" font-size="11">service cloud.firestore { match /databases/{database}/documents {</text>
      <text x="32" y="62" fill="#A78BFA" font-family="monospace" font-size="11">match /users/{userId} {</text>
      <text x="48" y="82" fill="#34D399" font-family="monospace" font-size="11">allow read, write: if request.auth.uid == userId;</text>
      <text x="32" y="102" fill="#A78BFA" font-family="monospace" font-size="11">}}}</text>

      <!-- Right: Audit Results -->
      <rect x="455" y="0" width="225" height="115" rx="8" fill="#020617" stroke="#1E293B"/>
      <text x="468" y="24" fill="#34D399" font-family="monospace" font-size="10">✓ Privilege Escalation: Safe</text>
      <text x="468" y="44" fill="#34D399" font-family="monospace" font-size="10">✓ Type Safety: Enforced</text>
      <text x="468" y="64" fill="#34D399" font-family="monospace" font-size="10">✓ Resource Exhaustion: Safe</text>
      <text x="468" y="84" fill="#38BDF8" font-family="monospace" font-size="10">App Hosting: Next.js SSR</text>
      <text x="468" y="104" fill="#FB923C" font-family="monospace" font-size="10">SDK: iOS / Android / Web</text>
    </g>
  </g>

  <!-- Terminal Command Footer -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="720" height="75" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="20" y="30" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">$ ./vas install firebase-security-rules-auditor --mode link</text>
    <text x="20" y="55" fill="#64748B" font-family="monospace" font-size="11">✓ Firebase Suite: firestore, firestore-rules, auth, app-hosting, crashlytics.</text>
  </g>
</svg>
