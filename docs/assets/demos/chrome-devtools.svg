<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#0B0F17" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Header Badge -->
  <rect x="40" y="30" width="180" height="26" rx="13" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1"/>
  <text x="130" y="47" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">OFFICIAL GOOGLE SKILL</text>
  
  <text x="40" y="90" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Chrome DevTools MCP Automation</text>
  <text x="40" y="114" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Direct Browser Control • Live DOM Debugging • Network Analysis • Heap Snapshots</text>

  <!-- DevTools Visual Mockup -->
  <g transform="translate(40, 140)">
    <!-- Browser Window Frame -->
    <rect x="0" y="0" width="720" height="180" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Window Bar -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H708C714.627 0 720 5.37258 720 12V32H0V12Z" fill="#1E293B"/>
    <circle cx="20" cy="16" r="5" fill="#EF4444"/>
    <circle cx="36" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="16" r="5" fill="#10B981"/>
    
    <!-- DevTools Tab Headers -->
    <text x="80" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Elements</text>
    <text x="140" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Console</text>
    <text x="195" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Network</text>
    <text x="255" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Memory</text>
    <text x="315" y="20" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Performance</text>

    <!-- Inspection Pane -->
    <g transform="translate(20, 48)">
      <!-- Left side: DOM tree -->
      <rect x="0" y="0" width="420" height="115" rx="8" fill="#050811" stroke="#1E293B"/>
      <text x="16" y="24" fill="#64748B" font-family="monospace" font-size="11">&lt;div class="antigravity-live-view"&gt;</text>
      <text x="32" y="44" fill="#38BDF8" font-family="monospace" font-size="11">&lt;button id="auth-btn" disabled=""&gt;</text>
      <text x="48" y="64" fill="#FACC15" font-family="monospace" font-size="11">Sign In With Google</text>
      <text x="32" y="84" fill="#38BDF8" font-family="monospace" font-size="11">&lt;/button&gt;</text>
      <text x="16" y="102" fill="#64748B" font-family="monospace" font-size="11">&lt;/div&gt;</text>

      <!-- Right side: Diagnostics -->
      <rect x="435" y="0" width="245" height="115" rx="8" fill="#020617" stroke="#1E293B"/>
      <text x="448" y="24" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">✓ DevTools Connected</text>
      <text x="448" y="46" fill="#E2E8F0" font-family="monospace" font-size="10">Target: localhost:3000</text>
      <text x="448" y="66" fill="#94A3B8" font-family="monospace" font-size="10">Heap: 24.2 MB / 32 MB</text>
      <text x="448" y="86" fill="#F59E0B" font-family="monospace" font-size="10">LCP: 850ms (Good)</text>
      <text x="448" y="104" fill="#38BDF8" font-family="monospace" font-size="10">Status: 200 OK (38 reqs)</text>
    </g>
  </g>

  <!-- Terminal Command Footer -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="720" height="75" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="20" y="30" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">$ ./vas install chrome-devtools --target workspace --mode link</text>
    <text x="20" y="55" fill="#64748B" font-family="monospace" font-size="11">✓ Linked: Antigravity can now autonomously debug, inspect network, and fix UI bugs.</text>
  </g>
</svg>
