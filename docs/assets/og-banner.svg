    <rect x="0" y="0" width="220" height="65" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">KỸ NĂNG</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2,650+ Skills</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="65" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="260" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">DANH MỤC</text>
    <text x="260" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#60a5fa">115 Categories</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="65" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
