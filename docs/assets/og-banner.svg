    <text x="500" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#10b981">100% Zero-NPX</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="220" height="65" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="740" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">MÔI TRƯỜNG</text>
    <text x="740" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f59e0b">Offline Python 3</text>
