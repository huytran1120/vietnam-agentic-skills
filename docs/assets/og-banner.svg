<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="og-glow" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="og-cyan-spot" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-purple-spot" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="og-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#060911"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-cyan-spot)"/>
  <rect width="1200" height="630" fill="url(#og-purple-spot)"/>

  <!-- Subtle Ambient Tech Grid (Inside Safe Bounds) -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Safe Container Frame (Center Aligned, 1060 x 530) -->
  <rect x="70" y="50" width="1060" height="530" rx="24" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- 1. Top Centered Badge -->
  <g transform="translate(600, 85)">
    <rect x="-195" y="0" width="390" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="-175" cy="17" r="4.5" fill="#38bdf8"/>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="1.2">
      VIETNAM AGENTIC SKILLS (VAS) • v1.3
    </text>
  </g>

  <!-- 2. Main Title (Centered) -->
  <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#og-title-grad)" text-anchor="middle" letter-spacing="-1">
    Vietnam Agentic Skills (VAS)
  </text>

  <!-- 3. Subtitle (Centered) -->
  <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="600" fill="#f1f5f9" text-anchor="middle">
    2,921+ Kỹ Năng Agentic Chuẩn Quốc Tế Cho AI Coding Agents
  </text>

  <!-- 4. Supported AI Agents (Centered) -->
  <text x="600" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Google Antigravity <tspan fill="#38bdf8">•</tspan> OpenAI Codex <tspan fill="#38bdf8">•</tspan> Claude Code <tspan fill="#38bdf8">•</tspan> Cursor <tspan fill="#38bdf8">•</tspan> Windsurf <tspan fill="#38bdf8">•</tspan> Cline <tspan fill="#38bdf8">•</tspan> Copilot
  </text>

  <!-- 5. Centered 3 Metric Feature Cards (Total width = 888px, starts at x=156) -->
  <g transform="translate(156, 320)">
    <!-- Pill 1: Skills Count -->
    <g transform="translate(0, 0)">
      <rect width="280" height="110" rx="16" fill="url(#og-card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
      <rect x="18" y="18" width="36" height="36" rx="10" fill="#0284c7" fill-opacity="0.25"/>
      <text x="36" y="42" font-size="18" fill="#38bdf8" text-anchor="middle">⚡</text>
      <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">KỸ NĂNG CHUẨN</text>
      <text x="64" y="48" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">117 CATEGORIES</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#ffffff">2,921+ Skills</text>
    </g>

    <!-- Pill 2: AI Platforms -->
    <g transform="translate(304, 0)">
      <rect width="280" height="110" rx="16" fill="url(#og-card-grad)" stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.4"/>
      <rect x="18" y="18" width="36" height="36" rx="10" fill="#7c3aed" fill-opacity="0.25"/>
      <text x="36" y="42" font-size="18" fill="#a78bfa" text-anchor="middle">🤖</text>
      <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" letter-spacing="0.5">AI PLATFORMS</text>
      <text x="64" y="48" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">UNIVERSAL SYMLINK</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#38bdf8">7+ AI Agents</text>
    </g>

    <!-- Pill 3: Zero-NPX Standard -->
    <g transform="translate(608, 0)">
      <rect width="280" height="110" rx="16" fill="url(#og-card-grad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
      <rect x="18" y="18" width="36" height="36" rx="10" fill="#059669" fill-opacity="0.25"/>
      <text x="36" y="42" font-size="18" fill="#34d399" text-anchor="middle">🛡️</text>
      <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.5">TIÊU CHUẨN ĐỘC LẬP</text>
      <text x="64" y="48" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">PYTHON 3 NATIVE</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#34d399">100% Zero-NPX</text>
    </g>
  </g>

  <!-- 6. Footer Information (Centered inside safe margin) -->
  <g transform="translate(600, 485)">
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Tác giả &amp; Duy trì: <tspan fill="#60a5fa" font-weight="700">Huy Tran (@huytran1120)</tspan> • <tspan fill="#34d399" font-weight="600">Zero Dependencies</tspan>
    </text>
    <text x="0" y="42" font-family="monospace" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">
      https://huytran1120.github.io/vietnam-agentic-skills/
    </text>
  </g>
</svg>
