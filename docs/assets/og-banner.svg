  <!-- Author Footer -->
  <g transform="translate(80, 510)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Tác giả &amp; Duy trì: <tspan fill="#60a5fa" font-weight="700">Huy Tran (@huytran1120)</tspan> • <tspan fill="#e2e8f0">https://huytran1120.github.io/vietnam-agentic-skills/</tspan></text>
