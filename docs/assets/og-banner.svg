      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0f19"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#111827" fill-opacity="0.6" stroke="#1e293b" stroke-width="2"/>

  <!-- Badge -->
  <g transform="translate(80, 100)">
    <rect width="320" height="42" rx="21" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="25" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#93c5fd">🇻🇳 GOOGLE ANTIGRAVITY CATALOG</text>
  </g>

  <!-- Title -->
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#titleGrad)">Vietnam Agentic Skills (VAS)</text>

  <!-- Subtitle -->
  <text x="80" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#e2e8f0">Kho 2,650+ Kỹ Năng Agentic Chuyên Sâu Cho Google Antigravity</text>

  <!-- Badges / Pillars -->
  <g transform="translate(80, 350)">
